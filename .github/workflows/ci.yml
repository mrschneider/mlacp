name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest pycryptodome gostcrypto
      - name: Run test suite
        run: python -m pytest tests/ -q

  e2e-cross-language:
    name: E2E cross-language (Node.js client × Python node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run cross-language E2E
        run: python experiments/run_e2e.py

      - name: Run federation E2E (two centers, UDS, custody_ack)
        run: python experiments/run_federation.py

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  native:
    name: Native backend (Rust/PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust gate (fmt + clippy + unit tests incl. timing)
        run: |
          cd native/mlacp-gost
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native wheel
        run: |
          python -m pip install maturin
          python -m maturin build --release -b pyo3 -m native/mlacp-gost/Cargo.toml --out dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheel
          path: dist-native/*.whl
