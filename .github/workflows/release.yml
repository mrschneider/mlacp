name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install pytest pycryptodome gostcrypto
      - name: Full test suite
        run: python -m pytest tests/ -q
      - name: Cross-language E2E gate
        run: python experiments/run_e2e.py
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build native wheel (Rust/PyO3, abi3-py310)
        run: |
          python -m pip install maturin
          python -m maturin build --release -b pyo3 -m native/mlacp-gost/Cargo.toml --out dist-native
      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            dist-native/*.whl
