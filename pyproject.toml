[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlacp"
version = "0.3.8"
description = "Multi-Layered Agentic Communication Protocol — agent-to-agent layers ported from reference architectures of the Soviet/Russian communications tradition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Schneider" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Security :: Cryptographic",
]

# The wire serializer has two backends: orjson (5-15x faster than the
# stdlib, and it is what the hot path was measured with) and the stdlib
# json fallback, which keeps the protocol importable on minimal
# environments (no C extensions, musl, PyPy). The extra installs the
# fast path: `pip install mlacp[speed]`.
[project.optional-dependencies]
speed = ["orjson>=3.9"]

[tool.setuptools.packages.find]
include = ["mlacp_core*", "mlacp_engine*"]
